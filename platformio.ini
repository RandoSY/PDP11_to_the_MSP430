[platformio]
src_dir = code/msp430
default_envs = timer_1khz, gpio_switch, interrupt_led, uart_hello, sensor_build_check

[env]
platform = timsp430@2.4.0
board = lpmsp430g2553
upload_protocol = tilib
debug_tool = mspdebug
board_build.f_cpu = 1000000L
build_flags = -Wall -Wextra

[env:timer_1khz]
build_src_filter = -<*> +<01_timer_1khz.c>

[env:gpio_switch]
build_src_filter = -<*> +<02_gpio_switch.c>

[env:interrupt_led]
build_src_filter = -<*> +<03_interrupt_led.c>

[env:uart_hello]
build_src_filter = -<*> +<04_uart_hello.c>

[env:sensor_build_check]
build_src_filter = -<*> +<06_ds18b20_decode.c> +<09_onewire_transport_CANDIDATE.c> +<10_ds18b20_transaction_CANDIDATE.c> +<platformio_sensor_build_check.c>
